name: E.ON Gmail hourly sync

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: eon-gmail-hourly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WATTMERLEG_CRON_URL: ${{ secrets.WATTMERLEG_CRON_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Validate configuration
        shell: bash
        run: |
          if [[ -z "${WATTMERLEG_CRON_URL}" ]]; then
            echo "::error::WATTMERLEG_CRON_URL is not configured."
            exit 1
          fi

          if [[ -z "${CRON_SECRET}" ]]; then
            echo "::error::CRON_SECRET is not configured."
            exit 1
          fi

      - name: Trigger E.ON Gmail sync
        shell: bash
        run: |
          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT

          if ! http_code="$(
            curl               --silent               --show-error               --connect-timeout 10               --max-time 60               --request GET               --header "Authorization: Bearer ${CRON_SECRET}"               --output "${response_file}"               --write-out "%{http_code}"               "${WATTMERLEG_CRON_URL}"
          )"; then
            echo "::error::The E.ON Gmail sync request failed before receiving a valid HTTP response."
            cat "${response_file}"
            exit 1
          fi

          cat "${response_file}"
          echo

          if [[ ! "${http_code}" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::E.ON Gmail sync returned HTTP ${http_code}."
            exit 1
          fi
